name: festival_tracker
description: Festival poster pipeline tracker for Triple S Production (TSP).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  cloud_firestore: ^5.6.9
  firebase_core: ^3.14.0
  firebase_auth: ^5.3.3
  collection: ^1.19.0
  google_fonts: ^6.2.1
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  cloud_functions: ^5.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  google_sign_in: ^7.1.1
  firebase_storage: ^12.4.10
  file_picker: ^11.0.3
  onesignal_flutter: ^5.6.7
  dio: ^5.11.0
  infinite_scroll_pagination: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
